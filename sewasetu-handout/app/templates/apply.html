{% extends "base.html" %}
{% block content %}
<div class="steps"><b>Step 1 of 6:</b> Mobile Verification &rsaquo; Personal Details &rsaquo; Address &rsaquo; Bank Details &rsaquo; Document Upload &rsaquo; Declaration</div>
<h2>Mobile Verification</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="mobile">Mobile Number</label>
  <input id="mobile" type="tel" name="mobile" maxlength="10" pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel" placeholder="10 digit mobile number" required>
  <label for="captcha">Security Check: What is {{ captcha_q }}?</label>
  <input id="captcha" type="text" name="captcha" inputmode="numeric" style="max-width:160px" required>
  <p><button class="btn" type="submit">Send OTP</button></p>
</form>
<p class="note">An OTP will be sent to your mobile number by SMS. OTP is valid for 5 minutes.</p>
{% endblock %}
