{% extends "base.html" %}
{% block content %}
<div class="steps"><b>Step 2 of 6:</b> Personal Details</div>
<h2>Personal Details</h2>
{% if chatbot_enabled %}<p><button class="btn btn-secondary" type="button" data-chat-question="How do I complete the personal details step?">Ask the assistant for help</button></p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="applicant_name">Full Name of Applicant (as per age proof document)</label>
  <input id="applicant_name" type="text" name="applicant_name" maxlength="100" autocomplete="name" value="{{ data.get('applicant_name','') }}" required>
  <label for="dob">Date of Birth (DD/MM/YYYY)</label>
  <input id="dob" type="text" name="dob" placeholder="DD/MM/YYYY" inputmode="numeric" value="{{ data.get('dob','') }}" required>
  <label for="gender">Gender</label>
  <select id="gender" name="gender" required>
    <option value="">--Select--</option>
    <option {% if data.get('gender')=='Male' %}selected{% endif %}>Male</option>
    <option {% if data.get('gender')=='Female' %}selected{% endif %}>Female</option>
    <option {% if data.get('gender')=='Other' %}selected{% endif %}>Other</option>
  </select>
  <label for="marital_status">Marital Status</label>
  <select id="marital_status" name="marital_status" required>
    <option value="">--Select--</option>
    <option {% if data.get('marital_status')=='Married' %}selected{% endif %}>Married</option>
    <option {% if data.get('marital_status')=='Unmarried' %}selected{% endif %}>Unmarried</option>
    <option {% if data.get('marital_status')=='Widowed' %}selected{% endif %}>Widowed</option>
  </select>
  <label for="husband_name">Husband's Name (if applicable)</label>
  <input id="husband_name" type="text" name="husband_name" maxlength="100" value="{{ data.get('husband_name','') }}">
  <label for="husband_employer">Husband's Current Employer (if applicable)</label>
  <input id="husband_employer" type="text" name="husband_employer" maxlength="100" value="{{ data.get('husband_employer','') }}">
  <p class="note">Fields marked above are mandatory as applicable.</p>
  <p><button class="btn" type="submit">Save &amp; Continue</button></p>
</form>
{% endblock %}
