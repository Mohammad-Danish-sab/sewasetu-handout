{% extends "base.html" %}
{% block content %}
<div class="steps"><b>Step 3 of 6:</b> Address Details</div>
<h2>Address Details</h2>
{% if chatbot_enabled %}<p><button class="btn btn-secondary" type="button" data-chat-question="How do I complete the address details step?">Ask the assistant for help</button></p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="village">Village / Town</label>
  <input id="village" type="text" name="village" maxlength="100" autocomplete="address-level2" value="{{ data.get('village','') }}" required>
  <label for="block">Block</label>
  <select id="block" name="block" required>
    <option value="">--Select--</option>
    {% for b in blocks %}
    <option {% if data.get('block')==b %}selected{% endif %}>{{ b }}</option>
    {% endfor %}
  </select>
  <p><button class="btn" type="submit">Save &amp; Continue</button></p>
</form>
{% endblock %}
